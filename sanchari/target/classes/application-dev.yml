# Dev profile: no real SMS or Digio needed.
anvay:
  otp:
    dev-fixed-code: "123456"   # every OTP is 123456. NEVER enable outside dev.
  sms:
    provider: console          # OTP is printed in the backend log
  digio:
    mode: stub                 # use POST /api/dev/kyc/{requestId}/{status} to simulate Digio's callback
logging:
  level:
    com.anvay: DEBUG
