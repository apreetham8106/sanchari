# Dev profile: no real SMS or Digio needed.
# every OTP is 123456. NEVER enable outside dev.
sanchari.otp.dev-fixed-code=123456
# OTP is printed in the backend log
sanchari.sms.provider=console
# use POST /api/dev/kyc/{requestId}/{status} to simulate Digio's callback
sanchari.digio.mode=stub
logging.level.com.sanchari=DEBUG
