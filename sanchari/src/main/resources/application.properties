# ======================================================================
# Sanchari backend configuration
# Database: MySQL (active). PostgreSQL settings are kept commented below.
# ======================================================================
server.port=8080

spring.application.name=sanchari-backend
#spring.profiles.active=dev

# ---------------------------------------------------------------------
# Database - MySQL 8.x (ACTIVE)
# ---------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/sanchari?useSSL=false&allowPublicKeyRetrieval=true&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&characterEncoding=UTF-8}
spring.datasource.username=root
spring.datasource.password=8106413551
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---------------------------------------------------------------------
# Database - PostgreSQL (DISABLED - uncomment these and comment the MySQL block above to switch back)
# Also: swap the dependency in pom.xml, the service in docker-compose.yml, and the schema/native query
#       (see db/postgres/01_schema.postgres.sql and the commented query in DriverLocationRepository).
# ---------------------------------------------------------------------
#spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/sanchari}
#spring.datasource.username=${DB_USER:sanchari}
#spring.datasource.password=${DB_PASSWORD:sanchari}
#spring.datasource.driver-class-name=org.postgresql.Driver
# (for PostgreSQL remove the preferred_uuid_jdbc_type line below so UUIDs use the native uuid type)

# ---------------------------------------------------------------------
# JPA / Hibernate
# ---------------------------------------------------------------------
spring.jpa.open-in-view=false
# schema comes from db/init/01_schema.sql (see README)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Kolkata
# MySQL has no native UUID type: store UUIDs as CHAR(36)
spring.jpa.properties.hibernate.type.preferred_uuid_jdbc_type=CHAR

spring.jackson.default-property-inclusion=non_null
#spring.jackson.serialization.write-dates-as-timestamps=true

# ---------------------------------------------------------------------
# Kafka
# ---------------------------------------------------------------------
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.auto-offset-reset=earliest

management.endpoints.web.exposure.include=health,info

# ---------------------------------------------------------------------
# Sanchari
# ---------------------------------------------------------------------
sanchari.cors.allowed-origins=${CORS_ORIGINS:http://localhost:4200}

# >= 32 bytes. Override with JWT_SECRET in any real environment.
sanchari.jwt.secret=${JWT_SECRET:sanchari-dev-secret-change-me-sanchari-dev-secret-change-me}
sanchari.jwt.access-ttl-minutes=15
sanchari.jwt.refresh-ttl-days=30

sanchari.otp.length=6
sanchari.otp.ttl-minutes=5
sanchari.otp.max-attempts=5
sanchari.otp.max-requests-per-window=3
sanchari.otp.window-minutes=10
# set only in the dev profile
sanchari.otp.dev-fixed-code=

# console | http
sanchari.sms.provider=console
sanchari.sms.http.url=
sanchari.sms.http.api-key=
sanchari.sms.http.sender-id=SANCHARI

# stub | http
sanchari.digio.mode=stub
sanchari.digio.base-url=https://ext.digio.in:444
sanchari.digio.client-id=
sanchari.digio.client-secret=
sanchari.digio.webhook-secret=
# PLACEHOLDER - align with your Digio account docs
sanchari.digio.driver-path=/v3/client/kyc/dl/request
# PLACEHOLDER - align with your Digio account docs
sanchari.digio.vehicle-path=/v3/client/kyc/rc/request

sanchari.dispatch.start-radius-m=1000
sanchari.dispatch.step-m=1000
sanchari.dispatch.max-radius-m=5000
sanchari.dispatch.offer-ttl-seconds=15
sanchari.dispatch.batch-size=5
sanchari.dispatch.search-timeout-seconds=120
sanchari.dispatch.location-freshness-seconds=30
sanchari.dispatch.tick-ms=3000
